<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- SEO：關閉 Google 搜尋 -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小善 美容師 | 數位名片</title>
    <!-- 引入高質感襯線與黑體字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg-color: #EEF3F8; --card-bg: #FFFFFF; --primary-color: #152C4A; --accent-color: #B89753; --text-main: #2D3748; --text-sub: #6A7B93; }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Noto Sans TC', sans-serif;
        }

        /* NFC 掃描動畫 */
        #nfc-loader {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-color); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
        }
        #nfc-loader.hidden { opacity: 0; visibility: hidden; }
        .nfc-waves { position: relative; width: 120px; height: 120px; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; }
        .nfc-wave { position: absolute; border: 2px solid var(--accent-color); border-radius: 50%; animation: ripple 2s cubic-bezier(0.21, 0.53, 0.56, 0.8) infinite; opacity: 0; }
        .nfc-wave:nth-child(1) { width: 40px; height: 40px; animation-delay: 0s; }
        .nfc-wave:nth-child(2) { width: 80px; height: 80px; animation-delay: 0.6s; }
        .nfc-wave:nth-child(3) { width: 120px; height: 120px; animation-delay: 1.2s; }
        .nfc-icon-center { position: relative; z-index: 2; font-size: 28px; color: #FFFFFF; background: linear-gradient(135deg, var(--primary-color), var(--accent-color)); width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.15); animation: float 2s ease-in-out infinite; }
        @keyframes ripple { 0% { transform: scale(0.5); opacity: 0; } 40% { opacity: 0.8; } 100% { transform: scale(1.5); opacity: 0; } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .nfc-loading-text { font-size: 16px; font-weight: 500; color: var(--primary-color); letter-spacing: 3px; font-family: 'Noto Serif TC', serif; animation: pulseText 1.5s ease-in-out infinite; }
        @keyframes pulseText { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* 雜誌風主卡片 */
        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 4px; /* 精品銳利微圓角 */
            padding: 50px 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.04);
            text-align: center;
            position: relative;
            border: 1px solid rgba(0,0,0,0.06);
        }

        /* 雙框線藝術裝飾 */
        .container::after {
            content: '';
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px solid var(--accent-color);
            opacity: 0.3;
            pointer-events: none;
            border-radius: 2px;
        }

        /* 橫向 LOGO */
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto 20px auto;
            border: 4px solid #fff;
            box-shadow: 0 8px 25px rgba(0,0,0,.15);
        }

        /* 姓名採用高級襯線字體 */
        .name {
            font-family: 'Noto Serif TC', serif;
            font-size: 30px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        /* 美容師職稱樣式（獨立於下方） */
        .title-sub {
            font-size: 14px;
            color: var(--text-sub);
            letter-spacing: 3px;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .editorial-meta {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(0,0,0,0.08);
        }
        .editorial-company {
            font-size: 13px;
            font-weight: 500;
            color: var(--accent-color);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .editorial-title {
            font-size: 14px;
            color: var(--text-sub);
            letter-spacing: 1px;
        }

        /* 細線聯絡清單 */
        .editorial-contact-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 35px;
            text-align: left;
        }
        .editorial-contact-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px dashed rgba(0,0,0,0.08);
            text-decoration: none;
        }
        .ec-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-sub);
            letter-spacing: 1.5px;
        }
        .ec-val {
            font-size: 14px;
            color: var(--text-main);
            font-weight: 500;
        }

        /* 精品風按鈕 (細框線與漸層交織) */
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .editorial-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 15px 20px;
            border-radius: 2px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border: 1px solid rgba(0,0,0,0.15);
            background-color: transparent;
            color: var(--text-main);
        }
        .editorial-btn:hover {
            background-color: var(--primary-color);
            color: #FFFFFF;
            border-color: var(--primary-color);
        }
        .editorial-btn i {
            margin-right: 10px;
            font-size: 18px;
        }

        /* 特殊按鈕色彩加強 */
        .btn-vcf-edit {
            background-color: var(--primary-color);
            color: #FFFFFF;
            border-color: var(--primary-color);
            font-weight: 600;
        }
        .btn-vcf-edit:hover {
            opacity: 0.9;
        }
        .btn-line-edit {
            border-color: #06C755;
            color: #06C755;
        }
        .btn-line-edit:hover {
            background-color: #06C755 !important;
            color: #FFFFFF !important;
            border-color: #06C755 !important;
        }
        .btn-ig-edit {
            border-color: #C13584;
            color: #C13584;
        }
        .btn-ig-edit:hover {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888) !important;
            color: #FFFFFF !important;
            border-color: transparent !important;
        }

        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: var(--text-sub);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- NFC 掃描動畫 -->
    <div id="nfc-loader">
        <div class="nfc-waves">
            <div class="nfc-wave"></div>
            <div class="nfc-wave"></div>
            <div class="nfc-wave"></div>
            <div class="nfc-icon-center"><i class="fas fa-mobile-alt"></i></div>
        </div>
        <div class="nfc-loading-text">NFC 名片感應中...</div>
    </div>

    <!-- 雜誌風主內容 -->
    <div class="container">
        <!-- 抓取 GitHub LOGO -->
        <img class="logo" src="showdou.jpeg" alt="小善美容師 LOGO">
        
        <h1 class="name">小善</h1>
        <div class="title-sub">美容師</div>
        
        <div class="editorial-meta">
            <div class="editorial-company">夏朵SPA</div>
            <div class="editorial-title">熱引痧｜芳療｜睫毛管理｜水療洗髮｜臉部保養｜除毛｜頌缽</div>
        </div>

        <!-- 聯絡資訊細線清單 -->
        <div class="editorial-contact-list">
            <a href="tel:0982771031" class="editorial-contact-item">
                <span class="ec-label">PHONE</span>
                <span class="ec-val">0982771031</span>
            </a>
            <a href="https://www.google.com/maps/search/?api=1&query=%E9%AB%98%E9%9B%84%E6%A5%A0%E6%A2%93%E5%8D%80%E5%A4%A7%E5%AD%B858%E8%A1%97332%E8%99%9F" target="_blank" rel="noopener noreferrer" class="editorial-contact-item">
                <span class="ec-label">ADDRESS</span>
                <span class="ec-val">高雄楠梓區大學58街332號</span>
            </a>
        </div>

        <!-- 按鈕區塊 -->
        <div class="links">
            <a href="showdou.vcf" class="editorial-btn btn-vcf-edit"><i class="fas fa-address-card"></i> 存入手機聯絡人</a>
            <a href="tel:0982771031" class="editorial-btn btn-primary-edit"><i class="fas fa-phone"></i> 立即通話</a>
            <a href="https://lin.ee/YiRktUa" target="_blank" class="editorial-btn btn-line-edit"><i class="fab fa-line"></i> LINE 官方諮詢</a>
            <a href="https://www.instagram.com/showdou1?stkn=Mjl2cDFsOWxlYjhr" target="_blank" class="editorial-btn btn-ig-edit"><i class="fab fa-instagram"></i> Instagram</a>
            <a href="https://www.facebook.com/share/1Dq85cgjDp/" target="_blank" class="editorial-btn" style="border-color: #1877F2; color: #1877F2;"><i class="fab fa-facebook-f"></i> Facebook</a>
        </div>

        <div class="footer">
            &copy; 2024 小善 美容師. ALL RIGHTS RESERVED.
        </div>
    </div>

    <!-- 動畫控制腳本 -->
    <script>
        setTimeout(function() {
            var loader = document.getElementById('nfc-loader');
            if(loader) loader.classList.add('hidden');
        }, 1800);
    </script>
</body>
</html>
