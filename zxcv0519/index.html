      :root{

        --sub:#718096;

      }
      *{

      }
      html{
        scroll-behavior:smooth
      }
      body{
        margin:0;
        -webkit-font-smoothing:antialiased
      }
      a{
        -webkit-tap-highlight-color:transparent
      }
      .v22-intro{
        position:fixed;
        inset:0;
        z-index:99999;
        background:var(--bg);
        display:grid;
        place-items:center;
        transition:opacity .6s ease,visibility .6s ease
      }
      .v22-intro.done{
        opacity:0;
        visibility:hidden
      }
      .v22-intro-stage{
        position:relative;
        width:220px;
        height:220px;
        display:grid;
        place-items:center
      }
      .v22-phone{
        width:56px;
        height:90px;
        border:1px solid var(--accent);
        border-radius:17px;
        display:grid;
        place-items:center;
        color:var(--accent);
        font-size:24px;
        animation:vfPhone .9s ease both
      }
      .v22-orbit{
        position:absolute;
        width:36px;
        height:36px;
        border-radius:50%;
        display:grid;
        place-items:center;
        background:rgba(255,255,255,.09);
        border:1px solid rgba(255,255,255,.16);
        color:var(--accent2);
        opacity:0;
        animation:vfScatter .9s .12s ease forwards
      }
      .v22-orbit.i1{
        --x:-78px;
        --y:-58px
      }
      .v22-orbit.i2{
        --x:80px;
        --y:-50px
      }
      .v22-orbit.i3{
        --x:-82px;
        --y:52px
      }
      .v22-orbit.i4{
        --x:82px;
        --y:55px
      }
      .v22-orbit.i5{
        --x:0px;
        --y:-98px
      }
      .v22-intro-title{
        position:absolute;
        top:177px;
        color:#fff;
        font-size:14px;
        font-weight:800;
        letter-spacing:5px;
        opacity:0;
        animation:vfTitle .7s .48s ease forwards
      }
      .v22-intro-sub{
        position:absolute;
        top:202px;
        color:rgba(255,255,255,.55);
        font-size:9px;
        letter-spacing:2px;
        opacity:0;
        animation:vfTitle .7s .6s ease forwards
      }
      @keyframes vfPhone{
        from{
          transform:scale(.8);
          opacity:0
        }
        to{
          transform:none;
          opacity:1
        }
      }
      @keyframes vfScatter{
        from{
          transform:scale(.4);
          opacity:0
        }
        to{
          transform:translate(var(--x),var(--y));
          opacity:1
        }
      }
      @keyframes vfTitle{
        from{
          opacity:0;
          transform:translateY(5px)
        }
        to{
          opacity:1;
          transform:none
        }
      }
      .reveal{
        opacity:0;
        transform:translateY(12px);
        transition:.55s ease
      }
      .reveal.in{
        opacity:1;
        transform:none
      }
      @media(prefers-reduced-motion:reduce){
        *{
          animation:none!important;
          transition:none!important

      .seal{

      .quote{

      .story-link{

      .foot{

      @media(max-width:450px){

        }

          padding-left:20px;

        }
        .quickbar{
          overflow:auto
        }
        .quick{
          flex:0 0 auto
        }
      }
    </style>

    <script>
      window.addEventListener('load',function(){setTimeout(function(){var x=document.getElementById('v22Intro');if(x)x.classList.add('done')},1150)});document.addEventListener('DOMContentLoaded',function(){var e=document.querySelectorAll('.reveal');if(!('IntersectionObserver'in window)){e.forEach(function(x){x.classList.add('in')});return}var o=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting)x.target.classList.add('in')})},{threshold:.05});e.forEach(function(x){o.observe(x)})});
    </script>
    <script id="nfc-local-logo-fallback">
      function tryNextLocalLogo_(img) {
        if (!img) return;
      
        var base = img.getAttribute("data-local-logo") || "zxcv0519";
        var tries = [base + ".png", base + ".jpg", base + ".jpeg"];
        var current = (img.getAttribute("src") || "").split("?")[0].toLowerCase();
        var index = -1;
      
        for (var i = 0; i < tries.length; i++) {
          if (current.endsWith(tries[i].toLowerCase())) {
            index = i;
            break;
          }
        }
      
        var next = index + 1;
        if (next < tries.length) {
          img.setAttribute("src", tries[next]);
          return;
        }
      
        img.onerror = null;
        img.style.visibility = "hidden";
        console.warn("找不到 LOGO：", tries.join(" / "));
      }
    </script>
