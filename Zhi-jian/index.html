<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- SEO：開啟 Google 搜尋 -->
    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>張智建 | 數位名片</title>
    <!-- 引入字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg-color: #EDF2F7; --card-bg: #FFFFFF; --primary-color: #1A365D; --accent-color: #C5A059; --text-main: #2D3748; --text-sub: #718096; --surface-color: #F0F4F8; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans TC', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* NFC 掃描動畫 (與前版相同) */
        #nfc-loader {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-color); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
        }
        #nfc-loader.hidden { opacity: 0; visibility: hidden; }
        .nfc-waves { position: relative; width: 120px; height: 120px; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; }
        .nfc-wave { position: absolute; border: 2px solid var(--accent-color); border-radius: 50%; animation: ripple 2s cubic-bezier(0.21, 0.53, 0.56, 0.8) infinite; opacity: 0; }
        .nfc-wave:nth-child(1) { width: 40px; height: 40px; animation-delay: 0s; }
        .nfc-wave:nth-child(2) { width: 80px; height: 80px; animation-delay: 0.6s; }
        .nfc-wave:nth-child(3) { width: 120px; height: 120px; animation-delay: 1.2s; }
        .nfc-icon-center { position: relative; z-index: 2; font-size: 28px; color: #FFFFFF; background: linear-gradient(135deg, var(--primary-color), var(--accent-color)); width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.15); animation: float 2s ease-in-out infinite; }
        @keyframes ripple { 0% { transform: scale(0.5); opacity: 0; } 40% { opacity: 0.8; } 100% { transform: scale(1.5); opacity: 0; } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .nfc-loading-text { font-size: 16px; font-weight: 600; color: var(--primary-color); letter-spacing: 3px; animation: pulseText 1.5s ease-in-out infinite; }
        @keyframes pulseText { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* 主容器 (拿掉邊框，用陰影展現極簡) */
        .container {
            width: 100%;
            max-width: 440px;
            text-align: center;
            animation: slideUp 0.8s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* 頭部資訊 */
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto;
            border: 4px solid #fff;
            box-shadow: 0 8px 25px rgba(0,0,0,.15);
        }
        
        .name { font-size: 28px; font-weight: 700; color: var(--primary-color); margin-bottom: 4px; }
        
        /* 獨立出的副職稱樣式 */
        .subtitle { font-size: 15px; color: var(--text-sub); margin-bottom: 16px; font-weight: 500; letter-spacing: 1.5px; }
        
        .profile-info { margin-bottom: 25px; }
        .company { font-size: 14px; font-weight: 600; color: var(--accent-color); letter-spacing: 1px; }
        .title { font-size: 13px; color: var(--text-sub); margin-top: 4px; }

        /* ✅ 核心設計：一鍵加入聯絡人 (全寬超大按鈕) */
        .btn-vcf-master {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-color) 100%);
            color: #FFFFFF;
            border-radius: 24px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            margin-bottom: 15px;
            transition: 0.3s;
        }
        .btn-vcf-master i { margin-right: 12px; font-size: 22px; }
        .btn-vcf-master:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.2); }

        /* ✅ 核心設計：Bento 網格排版 (Apple 小工具風格) */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .bento-item {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 25px 15px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
            transition: all 0.3s ease;
            border: 1px solid rgba(0,0,0,0.02);
            text-align: center;
        }
        .bento-item:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(0,0,0,0.06); }
        .bento-item i { font-size: 32px; margin-bottom: 12px; }
        .bento-item span { font-size: 14px; font-weight: 600; color: var(--text-main); }

        /* 如果按鈕是單數，最後一個自動橫向長大全寬！這就是方塊排版的魔力 */
        .bento-grid > .bento-item:last-child:nth-child(odd) {
            grid-column: span 2;
            flex-direction: row;
            padding: 20px;
            justify-content: center;
        }
        .bento-grid > .bento-item:last-child:nth-child(odd) i { margin-bottom: 0; margin-right: 15px; font-size: 24px; }

        /* 方塊專屬顏色配對 */
        .bento-call i { color: var(--primary-color); }
        .bento-line { background-color: #06C755; }
        .bento-line i, .bento-line span { color: #FFFFFF; }
        .bento-email i { color: var(--accent-color); }
        .bento-tel i { color: var(--text-sub); }
        .bento-address i { color: var(--primary-color); }

        /* ✅ 核心設計：社群圓形 Dock 懸浮列 */
        .social-dock {
            display: inline-flex;
            justify-content: center;
            gap: 15px;
            background-color: var(--card-bg);
            padding: 12px 20px;
            border-radius: 50px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
        }
        .social-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #FFF;
            font-size: 22px;
            transition: 0.3s;
        }
        .social-btn:hover { transform: scale(1.1); }
        
        .ig-color { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .fb-color { background-color: #1877F2; }
        .tk-color { background-color: #000000; }
        .web-color { background-color: var(--primary-color); }

        .footer { margin-top: 30px; font-size: 12px; color: #A0AEC0; }
    </style>
</head>
<body>

    <!-- NFC 掃描過場動畫 -->
    <div id="nfc-loader">
        <div class="nfc-waves">
            <div class="nfc-wave"></div>
            <div class="nfc-wave"></div>
            <div class="nfc-wave"></div>
            <div class="nfc-icon-center"><i class="fas fa-mobile-alt"></i></div>
        </div>
        <div class="nfc-loading-text">NFC 名片感應中...</div>
    </div>

    <!-- 視覺方塊主內容 -->
    <div class="container">
        <!-- 頭像區 -->
        <img class="logo" src="Zhi-jian.jpg" alt="張智建 LOGO">
        
        <h1 class="name">張智建</h1>
        <!-- 獨立的副職稱 -->
        <div class="subtitle">(銷售顧問/表面處理技術員)</div>
        
        <div class="profile-info"><div class="company">OT鍍膜</div><div class="title">居家｜車體｜改色、防爆膜</div></div>

        <!-- 頂部：超級醒目的加入聯絡人按鈕 -->
        <a href="Zhi-jian.vcf" class="btn-vcf-master"><i class="fas fa-address-card"></i> 存入手機聯絡人</a>

        <!-- 核心：方塊網格區塊 -->
        <div class="bento-grid">
            <a href="tel:0922117612" class="bento-item bento-call">
                <i class="fas fa-phone-alt"></i>
                <span>撥打電話</span>
            </a>
            
            <!-- 原本的 加 LINE 好友，更改為 LINE 官方 -->
            <a href="https://lin.ee/NL2WFxe" target="_blank" class="bento-item bento-line">
                <i class="fab fa-line"></i>
                <span>LINE 官方</span>
            </a>
            
            <!-- 從下方 Dock 移上來的個人 LINE，並套用綠色樣式 -->
            <a href="https://line.me/ti/p/6ZHMQvz0rV" target="_blank" class="bento-item bento-line">
                <i class="fab fa-line"></i>
                <span>LINE 個人</span>
            </a>
            
            <a href="mailto:asd900302900204@gmail.com" class="bento-item bento-email">
                <i class="fas fa-envelope"></i>
                <span>發送郵件</span>
            </a>
            
            <!-- 地址會因為是第 5 個奇數按鈕，自動放大填滿下方寬度 -->
            <a href="https://www.google.com/maps/search/?api=1&query=%E5%8F%B0%E4%B8%AD%E5%B8%82%E8%A5%BF%E5%B1%AF%E5%8D%80%E6%B0%B8%E5%BA%B7%E8%A1%9785%E8%99%9F" target="_blank" rel="noopener noreferrer" class="bento-item bento-address">
                <i class="fas fa-map-marker-alt"></i>
                <span>台中市西屯區永康街85號</span>
            </a>
        </div>

        <!-- 底部：圓形社群 Dock 列 (已將原本的網站按鈕移除) -->
        <div class="social-dock">
            <a href="https://www.instagram.com/ot.coating/" target="_blank" class="social-btn ig-color"><i class="fab fa-instagram"></i></a>
            <a href="https://www.facebook.com/profile.php?id=100068915152396" target="_blank" class="social-btn fb-color"><i class="fab fa-facebook-f"></i></a>
        </div>

        <div class="footer">
            &copy; 2024 張智建. All Rights Reserved.
        </div>
    </div>

    <!-- 動畫控制腳本 -->
    <script>
        setTimeout(function() {
            var loader = document.getElementById('nfc-loader');
            if(loader) loader.classList.add('hidden');
        }, 1800);
    </script>
</body>
</html>
